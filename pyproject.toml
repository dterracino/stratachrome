[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stratachrome"
version = "0.1.0"
description = "Automated single- or two-tier multi-color relief generator with optical filament blending and Bambu/Orca 3MF export."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
    { name = "Dave Terracino" }
]
keywords = [
    "3d-printing",
    "bambu-lab",
    "orca-slicer",
    "hueforge",
    "cielab",
    "cielch",
    "3mf",
    "birefnet",
    "computer-vision",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Manufacturing",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]

dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pillow>=10.0.0",
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "transformers>=4.38.0",
    "timm>=0.9.0",
    "einops>=0.7.0",
    "kornia>=0.7.0",
    "color-match-tools[image]>=6.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.7.0",
    "flake8>=6.1.0",
    "mypy>=1.5.0",
]

[project.scripts]
stratachrome = "stratachrome.pipeline:main"
stratachrome-segment = "stratachrome.segment_cli:main"
stratachrome-mesh = "stratachrome.stl_test_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stratachrome = ["resources/*.json"]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
